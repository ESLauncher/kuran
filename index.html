<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kuran Rehberi</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts (Amiri for Arabic text) -->
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&display=swap" rel="stylesheet">
    <!-- Özel Tasarım Dosyamızın stilleri -->
    <link href="style.css" rel="stylesheet" />
    <!-- SVG Favicon / İkon Desteği -->
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
</head>
<body>
    <div class="main-container p-4">
        <!-- Floating Top Nav Dock -->
        <header class="liquid-glass-card mac-floating-nav d-flex justify-content-center align-items-center py-3 mb-4">
            <h4 class="mb-0 fw-bolder text-success text-center" style="font-weight: 900;">Kuran Rehberi</h4>
        </header>

        <!-- Ana Arama ve Seçim Paneli -->
        <div class="liquid-glass-card p-4 mb-4">
            <div class="row g-3 align-items-center">
                <div class="col-md-6">
                    <div class="input-group">
                        <span class="input-group-text bg-transparent border-0">🔍</span>
                        <input type="text" id="aramaInput" class="form-control border-0 rounded-pill shadow-sm" 
                               placeholder="Sure ara (Duhâ, Mâide, Bakara...)..." 
                               style="background: rgba(255,255,255,0.7);"
                               oninput="sureleriFiltrele()" />
                    </div>
                </div>

                <div class="col-md-4">
                    <select id="sureSelect" class="form-select border-0 rounded-pill shadow-sm" 
                            style="background: rgba(255,255,255,0.7);" 
                            onchange="sureSecildi(this.value)">
                    </select>
                </div>

                <div class="col-md-2 text-end">
                    <span id="ayetSayisiBadge" class="badge bg-success rounded-pill px-3 py-2 shadow-sm">-- Ayet</span>
                </div>
            </div>
        </div>

        <!-- Yükleniyor Göstergesi -->
        <div id="loadingIndicator" class="text-center py-5 liquid-glass-card" style="display: none;">
            <div class="spinner-border text-success" role="status"></div>
            <p class="mt-2 text-muted fw-bold">Yükleniyor...</p>
        </div>

        <!-- Sure ve Meal Görünümü (Ok Tuşlu Sayfalandırma Alanı) -->
        <div id="icerikPaneli" class="liquid-glass-card p-4 p-md-5 position-relative" style="display: none;">
            <!-- Üst Başlık -->
            <div class="text-center mb-4">
                <h2 id="sureBaslik" class="fw-bold text-success mb-2"></h2>
            </div>

            <!-- Sayfalandırma Konteyneri (Oklar ve İçerik) -->
            <div class="d-flex align-items-center justify-content-between gap-2">
                
                <!-- Sol Ok (Önceki Sayfa) -->
                <button id="solBtn" onclick="sayfaDegistir(-1)" class="btn rounded-circle p-3 shadow-sm" style="background: rgba(255,255,255,0.7); border: 1px solid rgba(255,255,255,0.5); z-index: 10;">
                    ◀
                </button>

                <!-- İçerik Alanı -->
                <div class="flex-grow-1 text-center">
                    <!-- Arapça Metin Akışı (Satır Arası Çizgili ve Ferah Düzen) -->
                    <div id="arapcaAkis" class="mb-4 p-4 rounded-4" style="background: rgba(255,255,255,0.3);">
                    </div>

                    <hr style="border-color: rgba(0,0,0,0.1);" />

                    <!-- Meal ve Ses Listesi -->
                    <div id="mealListesi" class="d-flex flex-column gap-3 text-start">
                    </div>
                </div>

                <!-- Sağ Ok (Sonraki Sayfa) -->
                <button id="sagBtn" onclick="sayfaDegistir(1)" class="btn rounded-circle p-3 shadow-sm" style="background: rgba(255,255,255,0.7); border: 1px solid rgba(255,255,255,0.5); z-index: 10;">
                    ▶
                </button>

            </div>

            <!-- Sayfa Numarası Göstergesi -->
            <div class="text-center mt-4">
                <span id="sayfaBilgiBadge" class="badge bg-secondary bg-opacity-25 text-dark rounded-pill px-3 py-2">Sayfa 1 / 1</span>
            </div>
        </div>
    </div>

    <!-- JavaScript Kodları ve API Entegrasyonu -->

            { number: 98, turkce: "Beyyine", arapca: "البينة", ayet: 8 },
            { number: 99, turkce: "Zilzâl", arapca: "الزلزلة", ayet: 8 },
            { number: 100, turkce: "Âdiyât", arapca: "العاديات", ayet: 11 },
            { number: 101, turkce: "Kâria", arapca: "القارعة", ayet: 11 },
            { number: 102, turkce: "Tekâsür", arapca: "التكاثر", ayet: 8 },
            { number: 103, turkce: "Asr", arapca: "العصر", ayet: 3 },
            { number: 104, turkce: "Hümeze", arapca: "الهمزة", ayet: 9 },
            { number: 105, turkce: "Fîl", arapca: "الفيل", ayet: 5 },
            { number: 106, turkce: "Kureyş", arapca: "قريش", ayet: 4 },
            { number: 107, turkce: "Mâûn", arapca: "الماعون", ayet: 7 },
            { number: 108, turkce: "Kevser", arapca: "الكوثر", ayet: 3 },
            { number: 109, turkce: "Kâfirûn", arapca: "الكافرون", ayet: 6 },
            { number: 110, turkce: "Nasr", arapca: "النصر", ayet: 3 },
            { number: 111, turkce: "Tebbet (Mesed)", arapca: "المسد", ayet: 5 },
            { number: 112, turkce: "İhlâs", arapca: "الإخلاص", ayet: 4 },
            { number: 113, turkce: "Felak", arapca: "الفلق", ayet: 5 },
            { number: 114, turkce: "Nâs", arapca: "الناس", ayet: 6 }
        ];

        let tumArapcaAyetler = [];
        let tumMealAyetler = [];
        let tumSesAyetler = [];
        let aktifSayfa = 0;
        const ayetSayisiSayfaBasina = 4; // Her sayfada ferah okunması için 4 ayet
        let aktifSureNo = 1;

        document.addEventListener("DOMContentLoaded", () => {
            selectGuncelle(surelerListesi);
            sureYukle(1);
        });

        function normalize(text) {
            return text.toLowerCase()
                .replaceAll("â", "a").replaceAll("î", "i").replaceAll("û", "u")
                .replaceAll("ç", "c").replaceAll("ğ", "g").replaceAll("ı", "i")
                .replaceAll("ö", "o").replaceAll("ş", "s").replaceAll("ü", "u")
                .replaceAll("'", "").replaceAll("-", "").trim();
        }

        function selectGuncelle(liste) {
            const select = document.getElementById("sureSelect");
            select.innerHTML = "";
            liste.forEach(s => {
                let opt = document.createElement("option");
                opt.value = s.number;
                opt.textContent = `${s.number}. ${s.turkce} (${s.arapca})`;
                select.appendChild(opt);
            });
        }

        function sureleriFiltrele() {
            let val = document.getElementById("aramaInput").value;
            let filtrelenmis = surelerListesi.filter(s => 
                normalize(s.turkce).includes(normalize(val)) || s.number.toString() === val.trim()
            );
            selectGuncelle(filtrelenmis);
            if(filtrelenmis.length > 0) {
                sureYukle(filtrelenmis[0].number);
            }
        }

        function sureSecildi(no) {
            sureYukle(parseInt(no));
        }

        async function sureYukle(sureNo) {
            aktifSureNo = sureNo;
            document.getElementById("loadingIndicator").style.display = "block";
            document.getElementById("icerikPaneli").style.display = "none";

            let sureBilgi = surelerListesi.find(s => s.number === sureNo);
            document.getElementById("sureBaslik").textContent = `${sureBilgi.turkce} Suresi`;
            document.getElementById("ayetSayisiBadge").textContent = `${sureBilgi.ayet} Ayet`;

            try {
                // Resmi Uthmani hat standart API sürümü
                let res = await fetch(`https://api.alquran.cloud/v1/surah/${sureNo}/editions/quran-uthmani,tr.diyanet,ar.alafasy`);
                let data = await res.json();

                if(data && data.data) {
                    tumArapcaAyetler = data.data[0].ayahs;
                    tumMealAyetler = data.data[1].ayahs;
                    tumSesAyetler = data.data[2].ayahs;
                    
                    aktifSayfa = 0; 
                    sayfayiGoster();
                }
            } catch (err) {
                console.error("Hata:", err);
            } finally {
                document.getElementById("loadingIndicator").style.display = "none";
                document.getElementById("icerikPaneli").style.display = "block";
            }
        }

        function sayfaDegistir(yon) {
            let toplamSayfa = Math.ceil(tumArapcaAyetler.length / ayetSayisiSayfaBasina);
            aktifSayfa += yon;

            if (aktifSayfa < 0) {
                aktifSayfa = 0;
            } else if (aktifSayfa >= toplamSayfa) {
                aktifSayfa = toplamSayfa - 1;
            }

            sayfayiGoster();
        }

        function sayfayiGoster() {
            let baslangic = aktifSayfa * ayetSayisiSayfaBasina;
            let bitis = baslangic + ayetSayisiSayfaBasina;
            let sayfaArapca = tumArapcaAyetler.slice(baslangic, bitis);
            let sayfaMeal = tumMealAyetler.slice(baslangic, bitis);
            let sayfaSes = tumSesAyetler.slice(baslangic, bitis);

            let arapcaHTML = "";
            let mealHTML = "";

            for(let i = 0; i < sayfaArapca.length; i++) {
                let metin = sayfaArapca[i].text;
                if(aktifSureNo !== 1 && aktifSureNo !== 9 && (baslangic + i) === 0) {
                    const bismillah = "بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ";
                    if(metin.startsWith(bismillah)) {
                        metin = metin.substring(bismillah.length).trim();
                    }
                }

                let ayetNoRakam = arapcaRakamCevir(sayfaArapca[i].numberInSurah);
                
                // Her ayet satırı arasına ince geleneksel çizgi ve ferah satır aralığı eklendi
                arapcaHTML += `
                    <div class="py-3 px-2 text-center" style="direction: rtl; font-family: 'Amiri', serif;">
                        <span class="fs-2 text-dark lh-lg">${metin}</span> 
                        <span class="quran-number ms-2 me-1">۝${ayetNoRakam}</span>
                    </div>
                `;
                
                // Son eleman hariç araya çizgi koy
                if(i < sayfaArapca.length - 1) {
                    arapcaHTML += `<hr class="my-2" style="border-color: rgba(5, 150, 105, 0.2); width: 80%; margin: 0 auto;" />`;
                }

                mealHTML += `
                    <div class="p-3 rounded-3 shadow-sm" style="background: rgba(255,255,255,0.5); border-left: 4px solid #059669;">
                        <div class="d-flex justify-content-between align-items-center mb-2">
                            <span class="fw-bold text-success">[${sayfaArapca[i].numberInSurah}. Ayet]</span>
                            ${sayfaSes[i].audio ? `<audio controls style="height: 35px; max-width: 250px;"><source src="${sayfaSes[i].audio}" type="audio/mpeg"></audio>` : ''}
                        </div>
                        <div class="text-dark fs-5">${sayfaMeal[i].text}</div>
                    </div>
                `;
            }

            document.getElementById("arapcaAkis").innerHTML = arapcaHTML;
            document.getElementById("mealListesi").innerHTML = mealHTML;

            let toplamSayfa = Math.ceil(tumArapcaAyetler.length / ayetSayisiSayfaBasina);
            document.getElementById("sayfaBilgiBadge").textContent = `Sayfa ${aktifSayfa + 1} / ${toplamSayfa}`;
            
            document.getElementById("solBtn").style.opacity = aktifSayfa === 0 ? "0.4" : "1";
            document.getElementById("sagBtn").style.opacity = aktifSayfa === toplamSayfa - 1 ? "0.4" : "1";
        }

        function arapcaRakamCevir(num) {
            const harfler = {'0':'٠','1':'١','2':'٢','3':'٣','4':'٤','5':'٥','6':'٦','7':'٧','8':'٨','9':'٩'};
            return num.toString().split('').map(c => harfler[c] || c).join('');
        }
    </script>

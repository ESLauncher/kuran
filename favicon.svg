<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Arka plan hafif cam efekti için gradyan -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0fdf4" />
      <stop offset="100%" stop-color="#e0f2fe" />
    </linearGradient>
    
    <!-- Kuran kapağı için derin yeşil gradyan -->
    <linearGradient id="coverGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#047857" />
      <stop offset="100%" stop-color="#065f46" />
    </linearGradient>

    <!-- Sayfalar için yumuşak krem/beyaz gradyan -->
    <linearGradient id="pageGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>

    <!-- Gölge efekti -->
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#064e3b" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Yuvarlatılmış ikon arkaplanı (Modern iOS/App tarzı) -->
  <rect width="512" height="512" rx="110" fill="url(#bgGradient)" />

  <g filter="url(#shadow)" transform="translate(0, 15)">
    <!-- Sol Sayfa -->
    <path d="M 256 120 C 210 95 120 95 60 120 L 60 360 C 120 335 210 335 256 360 Z" fill="url(#pageGradient)" />
    <!-- Sağ Sayfa -->
    <path d="M 256 120 C 302 95 392 95 452 120 L 452 360 C 392 335 302 335 256 360 Z" fill="url(#pageGradient)" />

    <!-- Sayfa Çizgileri (Metin Simülasyonu) -->
    <g stroke="#cbd5e1" stroke-width="6" stroke-linecap="round" opacity="0.7">
      <!-- Sol Sayfa Çizgileri -->
      <line x1="90" y1="160" x2="220" y2="175" />
      <line x1="90" y1="200" x2="220" y2="215" />
      <line x1="90" y1="240" x2="220" y2="255" />
      <line x1="90" y1="280" x2="180" y2="293" />

      <!-- Sağ Sayfa Çizgileri -->
      <line x1="422" y1="160" x2="292" y2="175" />
      <line x1="422" y1="200" x2="292" y2="215" />
      <line x1="422" y1="240" x2="292" y2="255" />
      <line x1="422" y1="280" x2="332" y2="293" />
    </g>

    <!-- Açık Kuran Kapağı (Alt Katman / Perspektif Görünüm) -->
    <path d="M 256 360 C 210 335 120 335 60 360 L 60 385 C 120 360 210 360 256 385 C 302 360 392 360 452 385 L 452 360 C 392 335 302 335 256 360 Z" fill="url(#coverGradient)" />
    
    <!-- Alt Cilt / Omurga Parçası -->
    <path d="M 236 370 L 276 370 L 266 395 L 246 395 Z" fill="#022c22" opacity="0.6" />

    <!-- Altın Sarısı Dekoratif Ayrım / Işıltı -->
    <path d="M 256 100 L 256 360" stroke="#fbbf24" stroke-width="4" stroke-linecap="round" opacity="0.8" />
  </g>
</svg>
